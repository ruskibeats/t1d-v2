[project]
name = "t1d-companion"
version = "2.0.0"
description = "Educational Type 1 Diabetes meal impact companion and glucose forecast simulator"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
]

[project.scripts]
t1d-companion = "src.runner:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
